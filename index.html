<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>RunForHospice.org - Memory Bib</title>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script defer src="https://use.fontawesome.com/e03418bff9.js"></script>
        <link rel="stylesheet" href="css/styles.css" />
        <script src="index.js"></script>
    </head>
    <body>
        <main>
            <div x-data="bibForm" class="page-container">
                <div class="page-header">
                    <h1>#MemoryBib2025</h1>
                    <h3>
                        Brought to you by
                        <a
                            href="http://runforhospice.org"
                            title="Go to www.runforhospice.org"
                            target="_blank"
                            >RunForHospice.org</a
                        >
                    </h3>
                </div>
                <!-- <hr class="page-divider" /> -->

                <div class="container">
                    <fieldset>
                        <template
                            x-for="(name, index) in names.slice(0, lineCount)"
                            :key="index"
                        >
                            <input
                                class="line-text"
                                name="lineText"
                                x-model="names[index]"
                                type="text"
                                id="textInput"
                                :placeholder="placeHolderText(index)"
                            />
                        </template>

                        <div>
                            <label
                                class="line-count-label"
                                style="display: inline"
                                >Lines:&nbsp;</label
                            >
                            <input
                                type="radio"
                                id="one"
                                value="1"
                                name="lineCount"
                                x-model="lineCount"
                                title="One line"
                            />
                            <label class="line-count-label" htmlFor="one"
                                >1</label
                            >
                            <input
                                type="radio"
                                id="two"
                                value="2"
                                name="lineCount"
                                x-model="lineCount"
                                title="Two lines"
                            />
                            <label class="line-count-label" htmlFor="two"
                                >2</label
                            >
                            <input
                                type="radio"
                                id="three"
                                value="3"
                                name="lineCount"
                                x-model="lineCount"
                                title="Three lines"
                            />
                            <label class="line-count-label" htmlFor="three"
                                >3</label
                            >
                        </div>
                    </fieldset>
                </div>

                <div class="memory-bib" id="graphicText">
                    <ul class="bib-names">
                        <template
                            x-for="(name, index) in names.slice(0, lineCount)"
                        >
                            <li class="bib-name" x-text="name"></li>
                        </template>
                    </ul>
                </div>
                <div>
                    <button
                        x-show="names.slice(0, lineCount).join('').length > 0"
                        data-tooltip="Print your memory bib."
                        class="print-button"
                        onclick="window.print()"
                    >
                        <i class="fa fa-print"></i>
                        Print
                    </button>
                    <button
                        type="reset"
                        x-show="names.slice(0, lineCount).join('').length > 0"
                        data-tooltip="Reset Form"
                        @click="resetForm()"
                    >
                        <i class=""></i>
                        Reset
                    </button>
                </div>
            </div>
        </main>
        <!-- <footer>&copy 2025 RunForHospice.org</footer> -->
    </body>
</html>
