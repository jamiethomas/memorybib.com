<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RunForHospice.org - Memory Bib</title>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <script defer src="https://use.fontawesome.com/e03418bff9.js"></script>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <div x-data="{names: ['']}" class="page-container">
            <div class="page-header">
                <h1>#MemoryBib2025</h1>
                <h3>
                    Brought to you by
                    <a
                        href="http://runforhospice.org"
                        title="Go to www.runforhospice.org"
                        target="_blank"
                        >RunForHospice.org</a
                    >
                </h3>
            </div>
            <hr class="page-divider" />
            <div class="buttons">
                <button
                    x-show="names.join('') !=='' && names.length < 3"
                    @click="names.push('')"
                    class="add-button"
                >
                    <i class="fa fa-plus"></i>
                </button>
                <button
                    x-show="names.length > 1"
                    @click="names.pop()"
                    class="add-button"
                >
                    <i class="fa fa-minus"></i>
                </button>
            </div>

            <template x-for="(name, index) in names" :key="index">
                <input
                    class="name-input"
                    x-model="names[index]"
                    type="text"
                    id="textInput"
                    :placeholder="'Line ' + index + '...'"
                />
            </template>
            <div class="memory-bib" id="graphicText">
                <ul class="bib-names">
                    <template x-for="name in names">
                        <li class="bib-name" x-text="name"></li>
                    </template>
                </ul>
            </div>
            <button
                x-show="names.join('').length > 0"
                data-tooltip="Print your memory bib."
                class="print-button"
                onclick="window.print()"
            >
                <i class="fa fa-print"></i>
                Print
            </button>
        </div>
        <footer>&copy 2025 RunForHospice.org</footer>
    </body>
</html>
