<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Memory Bib</title>
        <style>
                        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');

                        body {
                            padding-bottom: 50px;
                            text-align: center;
                            color: #f8f8f8;
                            background: url(../img/memory-bib-bg.jpg) no-repeat center
                                center;
                            background-size: cover;
                        }
                        .container {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            height: 100vh;
                            xxbackground-color: #f0f0f0;
                        }
                        .intro-message {
                            font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial,
                                sans-serif;
                            font-weight: 700;
                        }
                        .intro-message h1 {
                            margin: 0;
                text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.6);
                font-size: 5em;
            }
                        }
                        .intro-message h3 {
                            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.6);
                        }
                        .intro-message a {
                            color: white;
                        }
                        .graphic {
                            position: relative;
                            width: 700px;
                            height: 556px;
                            background: url('/img/memory-bib-2025.png') no-repeat center
                                center;
                            background-size: contain;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 48px;
                            font-weight: bold;
                            text-align: center;
                            color: black;
                            border-radius: 33px;
                            overflow: hidden;
                            font-family: 'Permanent Marker', cursive;
                        }
                        .graphic span {
                            margin-top: 90px;
                            display: block;
                            max-width: 80%;
                            max-height: 60%;
                            overflow: hidden;
                            word-wrap: break-word;
                            white-space: normal;
                            border: 1px solid red;
                        }
                        input {
                            margin-bottom: 20px;
                            padding: 12px 15px;
                            font-size: 20px;
                            border: 2px solid #333;
                            border-radius: 8px;
                            outline: none;
                            transition: all 0.3s ease;
                            font-family: Arial, sans-serif;
                            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
                        }
                        input:focus {
                            border-color: #000;
                            box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.2);
                        }
                        @media print {
                            body * {
                                visibility: hidden;
                            }
                            .graphic {
                                visibility: visible;
                                position: absolute;
                                top: 0;
                                left: 0;
                                right: 0;
                                bottom: 0;
                                margin: auto;
                                -webkit-print-color-adjust: exact;
                                print-color-adjust: exact;
                            }
                        }
               .intro-divider {
                            xpadding-bottom: 50px;
                   text-align: center;
                   color: #f8f8f8;
                width: 50%;
            height: 1px;
                     }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="intro-message">
                <h1>#MemoryBib</h1>
                <h3>
                    Brought to you by
                    <a href="http://runforhospice.org">RunForHospice.org</a>
                </h3>
            </div>
            <hr class="intro-divider" />
            <input type="text" id="textInput" placeholder="Enter name..." />
            <div class="graphic" id="graphicText"><span></span></div>
        </div>
        <script>
            document
                .getElementById('textInput')
                .addEventListener('input', function () {
                    document.querySelector('#graphicText span').innerText =
                        this.value;
                });
        </script>
    </body>
</html>
